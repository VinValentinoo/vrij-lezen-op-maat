<svg viewBox="0 0 1000 720" width="1000" height="720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Systeemarchitectuur — Vrij lezen op maat</text>

  <!-- Front-end box -->
  <rect x="60" y="70" width="880" height="90" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="500" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">Front-end — Next.js (App Router) + React + TypeScript</text>
  <text x="500" y="122" text-anchor="middle" font-size="12.5" fill="#4338ca">Client components: /login /register /profiel /catalogus /advies /leeslijst /koppelen /docent</text>
  <text x="500" y="142" text-anchor="middle" font-size="12.5" fill="#4338ca">lib/api-client.ts (fetch-wrapper + JWT-header) · lib/cookies.ts (token in document.cookie) · lib/useCurrentUser (rol-hook)</text>

  <!-- Arrow FE -> BE -->
  <line x1="500" y1="160" x2="500" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="185" font-size="12" fill="#333">REST / JSON</text>
  <text x="515" y="200" font-size="12" fill="#333">Authorization: Bearer &lt;JWT&gt;</text>

  <!-- Back-end box -->
  <rect x="60" y="210" width="880" height="270" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="500" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">Back-end — NestJS (TypeScript)</text>
  <text x="500" y="254" text-anchor="middle" font-size="12" fill="#065f46">Gelaagd per module: controller → service → Prisma/Mongoose rechtstreeks (geen repository-laag)</text>

  <!-- module chips row 1 -->
  <g font-size="12" fill="#065f46">
    <rect x="85"  y="270" width="120" height="46" rx="6" fill="#d1fae5" stroke="#059669"/>
    <text x="145" y="290" text-anchor="middle" font-weight="bold">auth</text>
    <text x="145" y="305" text-anchor="middle" font-size="10">JWT, guards</text>

    <rect x="215" y="270" width="120" height="46" rx="6" fill="#d1fae5" stroke="#059669"/>
    <text x="275" y="290" text-anchor="middle" font-weight="bold">profile</text>
    <text x="275" y="305" text-anchor="middle" font-size="10">FR1 / FR2</text>

    <rect x="345" y="270" width="120" height="46" rx="6" fill="#d1fae5" stroke="#059669"/>
    <text x="405" y="290" text-anchor="middle" font-weight="bold">catalogus</text>
    <text x="405" y="305" text-anchor="middle" font-size="10">FR4</text>

    <rect x="475" y="270" width="120" height="46" rx="6" fill="#d1fae5" stroke="#059669"/>
    <text x="535" y="290" text-anchor="middle" font-weight="bold">advies</text>
    <text x="535" y="305" text-anchor="middle" font-size="10">FR3 — matching</text>

    <rect x="605" y="270" width="120" height="46" rx="6" fill="#d1fae5" stroke="#059669"/>
    <text x="665" y="290" text-anchor="middle" font-weight="bold">leeslijst</text>
    <text x="665" y="305" text-anchor="middle" font-size="10">FR5</text>

    <rect x="735" y="270" width="110" height="46" rx="6" fill="#d1fae5" stroke="#059669"/>
    <text x="790" y="290" text-anchor="middle" font-weight="bold">koppeling</text>
    <text x="790" y="305" text-anchor="middle" font-size="10">FR6</text>
  </g>

  <!-- module chip row 2: docent -->
  <g font-size="12" fill="#065f46">
    <rect x="85" y="330" width="120" height="46" rx="6" fill="#a7f3d0" stroke="#047857"/>
    <text x="145" y="350" text-anchor="middle" font-weight="bold">docent</text>
    <text x="145" y="365" text-anchor="middle" font-size="10">FR6, RolesGuard</text>
  </g>

  <text x="500" y="410" text-anchor="middle" font-size="12" fill="#065f46">Elke beveiligde route: JwtAuthGuard (+ RolesGuard waar rol DOCENT vereist is)</text>
  <text x="500" y="430" text-anchor="middle" font-size="12" fill="#065f46">DTO's met class-validator (validatie) + @nestjs/swagger (OpenAPI-contract, /api/docs)</text>
  <line x1="85" y1="450" x2="915" y2="450" stroke="#a7f3d0" stroke-width="1"/>
  <text x="500" y="470" text-anchor="middle" font-size="11" fill="#047857" font-style="italic">catalogusItemId op ReadingListItem: los ID-veld naar Mongo, geen FK — integriteit bewaakt in de service-laag</text>

  <!-- arrows BE -> DBs -->
  <line x1="330" y1="480" x2="230" y2="545" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="515" font-size="12" fill="#333">Prisma ORM</text>

  <line x1="670" y1="480" x2="770" y2="545" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="515" font-size="12" fill="#333">Mongoose ODM</text>

  <!-- Postgres box -->
  <rect x="60" y="550" width="400" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="260" y="578" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">PostgreSQL (relationeel)</text>
  <text x="260" y="600" text-anchor="middle" font-size="11.5" fill="#92400e">Transactionele, sterk gerelateerde data — NFR7</text>
  <text x="260" y="624" text-anchor="middle" font-size="11.5" fill="#78350f">User · ReadingProfile</text>
  <text x="260" y="644" text-anchor="middle" font-size="11.5" fill="#78350f">ReadingListItem · StudentDocentKoppeling</text>
  <text x="260" y="668" text-anchor="middle" font-size="10.5" fill="#92400e" font-style="italic">constraints + foreign keys</text>

  <!-- Mongo box -->
  <rect x="540" y="550" width="400" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="740" y="578" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">MongoDB (document store)</text>
  <text x="740" y="600" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Catalogus met wisselende metadata — NFR7</text>
  <text x="740" y="624" text-anchor="middle" font-size="11.5" fill="#1e40af">CatalogusItem</text>
  <text x="740" y="644" text-anchor="middle" font-size="10.5" fill="#1e40af">titel, beschrijving, taalniveau,</text>
  <text x="740" y="660" text-anchor="middle" font-size="10.5" fill="#1e40af">genre, onderwerp, lengte</text>
  <text x="740" y="678" text-anchor="middle" font-size="10.5" fill="#1e3a8a" font-style="italic">schemaloos, geen FK's</text>
</svg>
