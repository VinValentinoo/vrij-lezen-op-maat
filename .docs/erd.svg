<svg viewBox="0 0 1050 760" width="1050" height="760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1050" height="760" fill="#ffffff"/>
  <text x="525" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">ERD — Vrij lezen op maat</text>
  <text x="525" y="56" text-anchor="middle" font-size="12.5" fill="#6b7280">PostgreSQL (relationeel, via Prisma) + MongoDB (document store, via Mongoose)</text>

  <!-- User table -->
  <g>
    <rect x="60" y="90" width="230" height="188" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect x="60" y="90" width="230" height="30" rx="6" fill="#334155"/>
    <text x="175" y="110" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">User</text>
    <text x="75" y="140" font-size="12" fill="#1f2937">id (uuid) — PK</text>
    <text x="75" y="160" font-size="12" fill="#1f2937">email (unique)</text>
    <text x="75" y="180" font-size="12" fill="#1f2937">wachtwoordHash</text>
    <text x="75" y="200" font-size="12" fill="#1f2937">naam</text>
    <text x="75" y="220" font-size="12" fill="#1f2937">role (STUDENT | DOCENT)</text>
    <text x="75" y="240" font-size="12" fill="#1f2937">createdAt</text>
  </g>

  <!-- ReadingProfile table -->
  <g>
    <rect x="380" y="60" width="240" height="150" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect x="380" y="60" width="240" height="30" rx="6" fill="#334155"/>
    <text x="500" y="80" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">ReadingProfile</text>
    <text x="395" y="110" font-size="12" fill="#1f2937">id (uuid) — PK</text>
    <text x="395" y="130" font-size="12" fill="#1f2937">userId (unique) — FK</text>
    <text x="395" y="150" font-size="12" fill="#1f2937">taalniveau, genre, onderwerp,</text>
    <text x="395" y="167" font-size="12" fill="#1f2937">lengte, leesdoel</text>
    <text x="395" y="187" font-size="12" fill="#1f2937">updatedAt</text>
  </g>

  <!-- ReadingListItem table -->
  <g>
    <rect x="380" y="240" width="240" height="150" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect x="380" y="240" width="240" height="30" rx="6" fill="#334155"/>
    <text x="500" y="260" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">ReadingListItem</text>
    <text x="395" y="290" font-size="12" fill="#1f2937">id (uuid) — PK</text>
    <text x="395" y="310" font-size="12" fill="#1f2937">userId — FK</text>
    <text x="395" y="330" font-size="12" fill="#b45309" font-weight="bold">catalogusItemId (geen FK)</text>
    <text x="395" y="350" font-size="12" fill="#1f2937">status (NIET_GELEZEN | GELEZEN)</text>
    <text x="395" y="370" font-size="12" fill="#1f2937">toegevoegdOp</text>
  </g>

  <!-- StudentDocentKoppeling table -->
  <g>
    <rect x="60" y="330" width="240" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect x="60" y="330" width="240" height="30" rx="6" fill="#334155"/>
    <text x="180" y="350" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">StudentDocentKoppeling</text>
    <text x="75" y="380" font-size="12" fill="#1f2937">id (uuid) — PK</text>
    <text x="75" y="400" font-size="12" fill="#1f2937">studentId — FK naar User</text>
    <text x="75" y="420" font-size="12" fill="#1f2937">docentId — FK naar User</text>
    <text x="75" y="440" font-size="11" fill="#6b7280" font-style="italic">@@unique([studentId, docentId])</text>
  </g>

  <!-- relations within postgres -->
  <line x1="290" y1="150" x2="380" y2="130" stroke="#334155" stroke-width="1.5"/>
  <text x="300" y="120" font-size="11" fill="#334155">1 — 1</text>

  <line x1="290" y1="200" x2="380" y2="300" stroke="#334155" stroke-width="1.5"/>
  <text x="300" y="260" font-size="11" fill="#334155">1 — N</text>

  <line x1="180" y1="278" x2="180" y2="330" stroke="#334155" stroke-width="1.5"/>
  <text x="188" y="308" font-size="11" fill="#334155">1 — N (student)</text>

  <path d="M 290 240 C 340 320, 340 380, 300 400" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="292" y="415" font-size="11" fill="#334155">1 — N (docent)</text>

  <!-- Mongo CatalogusItem -->
  <g>
    <rect x="740" y="240" width="250" height="170" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="0"/>
    <rect x="740" y="240" width="250" height="30" rx="6" fill="#2563eb"/>
    <text x="865" y="260" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">CatalogusItem (Mongo)</text>
    <text x="755" y="290" font-size="12" fill="#1e3a8a">_id (ObjectId) — PK</text>
    <text x="755" y="310" font-size="12" fill="#1e3a8a">titel, beschrijving</text>
    <text x="755" y="330" font-size="12" fill="#1e3a8a">taalniveau, genre,</text>
    <text x="755" y="347" font-size="12" fill="#1e3a8a">onderwerp, lengte</text>
    <text x="755" y="372" font-size="10.5" fill="#1e40af" font-style="italic">document store, schemaloos</text>
    <text x="755" y="390" font-size="10.5" fill="#1e40af" font-style="italic">geen foreign keys mogelijk</text>
  </g>

  <!-- cross-db reference -->
  <line x1="620" y1="330" x2="740" y2="330" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow2)"/>
  <text x="680" y="320" text-anchor="middle" font-size="10.5" fill="#b45309">cross-database</text>

  <!-- legend -->
  <rect x="60" y="510" width="930" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="80" y="533" font-size="12.5" font-weight="bold" fill="#92400e">Let op — geen foreign key over databases heen</text>
  <text x="80" y="553" font-size="11.5" fill="#78350f">ReadingListItem.catalogusItemId verwijst naar een document in MongoDB, maar Postgres kan dat verband niet</text>
  <text x="80" y="570" font-size="11.5" fill="#78350f">afdwingen. Integriteit wordt bewust in de applicatielaag (services) bewaakt, niet door de database zelf.</text>

  <text x="525" y="620" text-anchor="middle" font-size="11" fill="#6b7280">Volledig schema: back-end/prisma/schema.prisma (Postgres) en back-end/src/modules/catalogus/schemas/catalogus-item.schema.ts (Mongo)</text>
</svg>
