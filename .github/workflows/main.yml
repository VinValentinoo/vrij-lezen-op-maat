name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Back-end — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"

      - name: Prisma Client genereren
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dummy

      - name: Unit tests
        run: npm test

  frontend:
    name: Front-end — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build